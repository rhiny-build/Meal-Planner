<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tonight</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C4A}a:hover{color:#143D31}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F2; font-family: Figtree, sans-serif; color: #1C221F; display: flex; flex-direction: column">
  <div style="padding: 28px 22px 12px; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; color: #4F5A54">Tuesday 13 October</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700">Tonight</span>
    </div>
    <span style="font-size: 13px; color: #4F5A54; background: #E3E8E3; padding: 6px 10px; border-radius: 999px">Note: football till 7</span>
  </div>

  <div style="margin: 8px 16px 0; background: #1F5C4A; color: #FFFFFF; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #CFE3DA">Dinner</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.1">Oven Baked Chicken Schnitzel</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="font-size: 13px; background: rgba(255,255,255,0.14); padding: 5px 10px; border-radius: 999px">+ Simple Fries</span>
      <span style="font-size: 13px; background: rgba(255,255,255,0.14); padding: 5px 10px; border-radius: 999px">+ Rocket Salad</span>
      <span style="font-size: 13px; background: rgba(255,255,255,0.14); padding: 5px 10px; border-radius: 999px">40 min</span>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 4px">
      <a href="Recipe.dc.html" style="flex: 1; text-align: center; text-decoration: none; background: #F2B544; color: #1C221F; font-weight: 600; font-size: 17px; padding: 14px 0; border-radius: 14px">Start cooking</a>
      <button style="width: 52px; border: none; border-radius: 14px; background: rgba(255,255,255,0.14); color: #FFFFFF; cursor: pointer" aria-label="Swap tonight's meal">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4l-4 4 4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg>
      </button>
    </div>
  </div>

  <div style="padding: 22px 22px 8px; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Rest of the week</span>
    <a href="Week.dc.html" style="font-size: 14px; font-weight: 600">See week</a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 14px; padding: 12px 14px">
        <span style="width: 38px; font-size: 13px; font-weight: 600; color: #4F5A54">{{d.day}}</span>
        <div style="display: flex; flex-direction: column; flex: 1">
          <span style="font-size: 15px; font-weight: 600">{{d.meal}}</span>
          <span style="font-size: 13px; color: #4F5A54">{{d.side}}</span>
        </div>
        <span style="font-size: 12px; color: #4F5A54">{{d.tag}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin: auto 16px 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="Shop.dc.html" style="text-decoration: none; color: #1C221F; background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 600; font-size: 15px">Shopping list</span>
      <span style="font-size: 13px; color: #4F5A54">23 items, delivery Sat</span>
    </a>
    <button style="text-align: left; border: none; cursor: pointer; font-family: Figtree, sans-serif; color: #1C221F; background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-weight: 600; font-size: 15px">Draft next week</span>
      <span style="font-size: 13px; color: #4F5A54">From your notes</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      days: [
        { day: 'Wed', meal: 'Beef Keema with Peas', side: 'Simple Steamed Rice', tag: 'Full' },
        { day: 'Thu', meal: 'Out', side: 'From your notes', tag: '' },
        { day: 'Fri', meal: 'Burgers and Fries', side: 'Quick main', tag: 'Quick' },
        { day: 'Sat', meal: 'Lemon Garlic Salmon', side: 'Israeli Salad', tag: 'Full' }
      ]
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5C4A}a:hover{color:#143D31}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F2; font-family: Figtree, sans-serif; color: #1C221F; display: flex; flex-direction: column">
  <div style="padding: 28px 22px 10px; display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 14px; color: #4F5A54">12–18 October</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 700">This week</span>
  </div>

  <div style="margin: 6px 16px 10px; background: #FBEBC8; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
      <span style="font-weight: 600; font-size: 15px">Drafted from your notes</span>
      <span style="font-size: 13px; color: #4F5A54">Quick meals on busy days. Fish twice.</span>
    </div>
    <button style="border: none; border-radius: 12px; background: #1C221F; color: #FFFFFF; font-family: Figtree, sans-serif; font-weight: 600; font-size: 14px; padding: 12px 14px; cursor: pointer">Accept all</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px; overflow: hidden">
    <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
      <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
        <div style="width: 42px; display: flex; flex-direction: column; align-items: center">
          <span style="font-size: 12px; color: #4F5A54">{{d.day}}</span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">{{d.date}}</span>
        </div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 15px; font-weight: 600">{{d.meal}}</span>
          <span style="font-size: 13px; color: #4F5A54">{{d.why}}</span>
        </div>
        <button aria-label="Swap this day" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: #F3F5F2; color: #1C221F; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 4l-4 4 4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="margin: auto 16px 18px; display: flex; gap: 10px; align-items: center; background: #FFFFFF; border-radius: 16px; padding: 8px 8px 8px 16px">
    <label for="ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Ask for a change</label>
    <input id="ask" placeholder="e.g. swap Wednesday for fish" style="flex: 1; border: none; font-family: Figtree, sans-serif; font-size: 15px; outline: none; background: transparent; min-height: 44px">
    <button style="border: none; border-radius: 12px; background: #1F5C4A; color: #FFFFFF; font-family: Figtree, sans-serif; font-weight: 600; font-size: 15px; padding: 12px 16px; cursor: pointer">Ask</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      days: [
        { day: 'Mon', date: '12', meal: 'Pan Fried Sea Bass', why: 'Fish, quick' },
        { day: 'Tue', date: '13', meal: 'Oven Baked Chicken Schnitzel', why: 'Football till 7: done by 7:30' },
        { day: 'Wed', date: '14', meal: 'Beef Keema with Peas', why: 'Not had it for 3 weeks' },
        { day: 'Thu', date: '15', meal: 'Out', why: 'From your notes' },
        { day: 'Fri', date: '16', meal: 'Burgers and Fries', why: 'Quick main' },
        { day: 'Sat', date: '17', meal: 'Lemon Garlic Salmon', why: 'Fish, family favourite' },
        { day: 'Sun', date: '18', meal: 'Shini’s Meatballs and Israeli Couscous', why: 'Longer cook, weekend' }
      ]
    };
  }
}
</script>
</body>
</html>
